[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithms-from-scratch"
version = "0.1.0"
description = "以 Python 從零實作經典演算法：與基準實作對照驗證正確性，比對理論複雜度與實測數據，並延伸出兩個可用的 CLI 工具"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Terence Chou" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
