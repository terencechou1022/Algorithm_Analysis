[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-analysis"
version = "0.1.0"
description = "Classic algorithms implemented from scratch in Python, with tests and empirical complexity analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Terence Chou" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
